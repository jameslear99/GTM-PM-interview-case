<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inbox · GTM Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F0F4F8;--bg2:#FFFFFF;--bg3:#F1F5F9;--bg4:#E2E8F0;--accent:#0BBFB3;--acc-d:rgba(11,191,179,0.10);--acc-b:rgba(11,191,179,0.30);--amber:#D97706;--amb-d:rgba(217,119,6,0.10);--coral:#E8664A;--cor-d:rgba(232,102,74,0.10);--green:#059669;--grn-d:rgba(5,150,105,0.10);--text:#0F172A;--text2:#475569;--text3:#94A3B8;--border:rgba(0,0,0,0.07);--nav-h:56px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
.topnav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);background:rgba(255,255,255,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;z-index:200}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;flex-shrink:0}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.logo-name{font-size:15px;font-weight:700;color:var(--text);letter-spacing:-0.02em}
.role-badge{font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;background:var(--acc-d);color:var(--accent);padding:2px 7px;border-radius:99px;border:1px solid var(--acc-b)}
.nav-links{display:flex;align-items:center;gap:2px;flex:1}
.nav-link{font-size:13px;font-weight:500;color:var(--text2);text-decoration:none;padding:5px 12px;border-radius:6px;transition:all 0.15s;white-space:nowrap}
.nav-link:hover{color:var(--text);background:var(--bg3)}
.nav-link.active{color:var(--accent);background:var(--acc-d)}
.nav-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text2)}
.main{padding-top:var(--nav-h);height:100%;overflow:hidden}
.role-toggle{position:fixed;bottom:20px;left:20px;z-index:300;display:flex;align-items:center;gap:8px;background:var(--text);border:1px solid transparent;color:rgba(255,255,255,0.8);font-size:12px;font-weight:600;font-family:inherit;padding:8px 16px;border-radius:99px;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,0.18);transition:all 0.2s}
.role-toggle:hover{border-color:var(--accent);color:var(--accent)}
.toggle-dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
body.role-sdr .ae-only{display:none!important}
body.role-ae  .sdr-only{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:600;font-family:inherit;padding:7px 14px;border-radius:7px;cursor:pointer;border:none;transition:all 0.15s;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--accent);color:#0D1B2A}
.btn-primary:hover{background:#0dd9cc}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:5px}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}

/* inbox layout */
.inbox-wrap{display:grid;grid-template-columns:320px 1fr;height:100%;overflow:hidden}
.thread-list{border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.thread-search{padding:12px;border-bottom:1px solid var(--border);flex-shrink:0}
.thread-search input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:inherit;font-size:12px;padding:7px 12px;outline:none}
.thread-search input:focus{border-color:var(--acc-b)}
.thread-search input::placeholder{color:var(--text3)}
.filter-tabs{display:flex;padding:8px 12px;gap:4px;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.ftab{font-size:11px;font-weight:600;padding:4px 10px;border-radius:5px;cursor:pointer;color:var(--text3);background:none;border:none;font-family:inherit;white-space:nowrap;transition:all 0.15s}
.ftab:hover{color:var(--text2)}
.ftab.active{background:var(--bg3);color:var(--accent)}
.thread-items{flex:1;overflow-y:auto}
.thread-item{padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.1s;display:flex;gap:10px;align-items:flex-start}
.thread-item:hover,.thread-item.selected{background:var(--bg3)}
.thread-item.unread .ti-name{font-weight:700;color:var(--text)}
.ti-avatar{width:32px;height:32px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text2);flex-shrink:0}
.ti-body{flex:1;min-width:0}
.ti-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.ti-name{font-size:12px;font-weight:500;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti-time{font-size:10px;color:var(--text3);flex-shrink:0}
.ti-company{font-size:11px;color:var(--text3);margin-bottom:2px}
.ti-preview{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti-badge{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:6px}
.ti-type{font-size:9px;color:var(--text3);background:var(--bg4);padding:1px 5px;border-radius:3px;margin-right:4px}

/* thread detail */
.thread-detail{display:flex;flex-direction:column;overflow:hidden}
.td-header{padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.td-h-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.td-name{font-size:16px;font-weight:700;color:var(--text)}
.td-company{font-size:12px;color:var(--text3);margin-top:2px}
.td-actions{display:flex;gap:6px}
.td-messages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:10px;max-width:80%}
.msg.out{align-self:flex-end;flex-direction:row-reverse}
.msg-bubble{padding:10px 14px;border-radius:12px;font-size:12px;line-height:1.6}
.msg.in  .msg-bubble{background:var(--bg3);color:var(--text2);border-radius:12px 12px 12px 3px}
.msg.out .msg-bubble{background:var(--acc-d);color:var(--text);border-radius:12px 12px 3px 12px;border:1px solid var(--acc-b)}
.msg-avatar{width:26px;height:26px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--text2);flex-shrink:0;margin-top:2px}
.msg-meta{font-size:10px;color:var(--text3);margin-top:3px}
.msg.out .msg-meta{text-align:right}
.ai-draft-bar{background:var(--amb-d);border-top:1px solid rgba(245,158,11,0.2);padding:12px 20px;flex-shrink:0}
.ai-draft-label{font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--amber);margin-bottom:8px}
.ai-draft-text{background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:inherit;font-size:12px;line-height:1.6;padding:10px;width:100%;resize:none;outline:none;height:70px}
.ai-draft-text:focus{border-color:var(--acc-b)}
.compose-bar{border-top:1px solid var(--border);padding:12px 20px;flex-shrink:0;display:flex;gap:10px;align-items:flex-end}
.compose-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:12px;line-height:1.6;padding:10px 12px;resize:none;outline:none;min-height:40px;max-height:120px}
.compose-input:focus{border-color:var(--acc-b)}
.compose-input::placeholder{color:var(--text3)}

.info-chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--text3);background:var(--bg3);padding:3px 8px;border-radius:99px;border:1px solid var(--border)}

@media(max-width:768px){.inbox-wrap{grid-template-columns:1fr}.thread-detail{display:none}}
</style>
</head>
<body class="role-sdr">

<nav class="topnav">
  <a class="nav-logo" href="index.html">
    <span class="logo-dot"></span>
    <span class="logo-name">GTM Engine</span>
    <span class="role-badge" id="role-badge">SDR</span>
  </a>
  <div class="nav-links">
    <a class="nav-link" href="index.html">Home</a>
    <a class="nav-link active" href="inbox.html">Inbox</a>
    <a class="nav-link ae-only" href="calendar.html">Calendar</a>
    <a class="nav-link" href="calling.html" id="queue-link">Call Queue</a>
  </div>
  <div class="nav-right">
    <div class="avatar">JL</div>
  </div>
</nav>

<div class="main">
  <div class="inbox-wrap">

    <!-- Thread list -->
    <div class="thread-list">
      <div class="thread-search">
        <input type="text" placeholder="Search contacts…">
      </div>
      <div class="filter-tabs" id="filter-tabs">
        <button class="ftab active sdr-only" onclick="setFilter('all',this)">All</button>
        <button class="ftab sdr-only" onclick="setFilter('calls',this)">Calls</button>
        <button class="ftab sdr-only" onclick="setFilter('texts',this)">Texts</button>
        <button class="ftab sdr-only" onclick="setFilter('missed',this)">Missed</button>
        <button class="ftab ae-only" onclick="setFilter('all',this)">All</button>
        <button class="ftab ae-only" onclick="setFilter('email',this)">Email</button>
        <button class="ftab ae-only" onclick="setFilter('followup',this)">Follow-ups</button>
        <button class="ftab ae-only" onclick="setFilter('proposals',this)">Proposals</button>
      </div>
      <div class="thread-items" id="thread-items"></div>
    </div>

    <!-- Thread detail -->
    <div class="thread-detail">
      <div class="td-header">
        <div class="td-h-top">
          <div>
            <div class="td-name" id="td-name">Maria Santos</div>
            <div class="td-company" id="td-company">Practice Manager · Rivera Dental Group</div>
          </div>
          <div class="td-actions">
            <button class="btn btn-ghost btn-sm">Account →</button>
            <button class="btn btn-primary btn-sm" id="td-cta">📞 Call</button>
          </div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap" id="td-chips"></div>
      </div>

      <div class="td-messages" id="td-messages"></div>

      <!-- AI draft (SDR: after unanswered call) -->
      <div class="ai-draft-bar sdr-only" id="ai-draft-bar" style="display:none">
        <div class="ai-draft-label">✦ AI-drafted follow-up — unanswered call</div>
        <textarea class="ai-draft-text" id="ai-draft-text"></textarea>
        <div style="display:flex;justify-content:flex-end;gap:6px;margin-top:8px">
          <button class="btn btn-ghost btn-sm" onclick="document.getElementById('ai-draft-bar').style.display='none'">Dismiss</button>
          <button class="btn btn-primary btn-sm">Send text</button>
        </div>
      </div>

      <!-- Compose -->
      <div class="compose-bar">
        <textarea class="compose-input" placeholder="Write a message…" rows="1"></textarea>
        <button class="btn btn-primary btn-sm">Send</button>
      </div>
    </div>

  </div>
</div>

<button class="role-toggle" id="role-toggle" onclick="toggleRole()">
  <span class="toggle-dot"></span>
  <span id="toggle-label">Switch to AE View</span>
</button>

<script>
// ─── THREAD DATA ─────────────────────────────────────────────────────────────
const sdrThreads = [
  {
    id:1, type:'text', unread:true, name:'Jennifer Walsh', initials:'JW', company:'Walsh Home Services',
    time:'2m ago', preview:'maybe, let me know when you can call',
    chips:['Text thread','High intent','2 locations'],
    messages:[
      {dir:'out', text:'Hi Jennifer, I\'m James from Podium — noticed you were comparing us against a few alternatives. Happy to answer your questions directly. Is now a good time for a quick call?', time:'10:42 AM'},
      {dir:'in',  text:'I\'m in meetings most of today. Can we do it another time?', time:'10:58 AM'},
      {dir:'out', text:'Absolutely — what works for you this week? I can do any morning or Thursday afternoon.', time:'11:01 AM'},
      {dir:'in',  text:'maybe, let me know when you can call', time:'11:03 AM'},
    ],
    aiDraft:'Hi Jennifer, any chance Thursday morning works for a quick 15-minute call? I can answer your comparison questions directly and you can decide from there — no pressure.',
    cta:'📞 Call',
  },
  {
    id:2, type:'call', unread:true, name:'Carlos Torres', initials:'CT', company:'Torres Auto Body',
    time:'1h ago', preview:'Outbound call — no answer. AI follow-up sent.',
    chips:['Win-back','Call attempt #1'],
    messages:[
      {dir:'out', text:'📞 Outbound call — no answer (11:24 AM)', time:'11:24 AM', system:true},
      {dir:'out', text:'Hey Carlos, James from Podium — you texted back yesterday. Wanted to have a quick honest conversation about what\'s changed since you left. I\'ll also send a note by email.', time:'11:25 AM', label:'AI draft sent'},
    ],
    cta:'📞 Call again',
  },
  {
    id:3, type:'missed', unread:false, name:'Summit Orthodontics', initials:'RK', company:'Rachel Kim',
    time:'2h ago', preview:'Inbound call — missed. Voicemail left.',
    chips:['Inbound missed','Trial day 8'],
    messages:[
      {dir:'in', text:'📞 Inbound call from (801) 555-0604 — missed (9:18 AM)', time:'9:18 AM', system:true},
      {dir:'in', text:'🎙 Voicemail: "Hi, this is Rachel from Summit Orthodontics — I was trying to figure out how to set up the review thing. Could someone call me back?"', time:'9:19 AM'},
    ],
    aiDraft:'Hi Rachel, so sorry I missed your call! Setting up reviews takes about 5 minutes — I\'ll send you a quick step-by-step guide right now, and I can call you back this afternoon to walk through it together if that helps.',
    cta:'📞 Call back',
  },
  {
    id:4, type:'text', unread:false, name:'Maria Santos', initials:'MS', company:'Rivera Dental Group',
    time:'Yesterday', preview:'Sounds good, I\'ll look for your email.',
    chips:['Text thread','Pricing page x2'],
    messages:[
      {dir:'out', text:'Hi Maria, James from Podium — I noticed Rivera Dental Group has been looking at our pricing page and wanted to reach out personally. Do you have 15 minutes this week?', time:'Yesterday 2:14 PM'},
      {dir:'in',  text:'Sounds good, I\'ll look for your email.', time:'Yesterday 2:31 PM'},
    ],
    cta:'📞 Call',
  },
  {
    id:5, type:'text', unread:false, name:'David Park', initials:'DP', company:'Park Family Dentistry',
    time:'Yesterday', preview:'Not yet — let me take a look and I\'ll get back to you.',
    chips:['Warm referral','Dr. Kim @ Clearfield'],
    messages:[
      {dir:'out', text:'Hi Dr. Park, I\'m James from Podium — Dr. Kim at Clearfield Dental suggested I reach out. They\'ve had great results with us and thought you might find it useful too. Happy to show you in 20 minutes.', time:'Yesterday 3:45 PM'},
      {dir:'in',  text:'Not yet — let me take a look and I\'ll get back to you.', time:'Yesterday 4:12 PM'},
    ],
    cta:'📞 Call',
  },
];

const aeThreads = [
  {
    id:10, type:'email', unread:true, name:'Chris Adams', initials:'CA', company:'Mesa Verde Plumbing',
    time:'8m ago', preview:'Quick question on the ServiceTitan side…',
    chips:['Demo today 10 AM','$9,600/yr','Email'],
    messages:[
      {dir:'in',  text:'Hi James, looking forward to the call today. Quick question — can Podium integrate with ServiceTitan for the job follow-up texts? Our operations run entirely out of ST.', time:'8:12 AM'},
    ],
    cta:'Reply',
  },
  {
    id:11, type:'email', unread:false, name:'Dr. Patricia Ngo', initials:'PN', company:'Greenfield Family Dental',
    time:'2h ago', preview:'Your follow-up email — opened 3 times',
    chips:['Demo today 1:30 PM','$3,600/yr','Opened email'],
    messages:[
      {dir:'out', text:'Hi Dr. Ngo, looking forward to our call at 1:30 today. Just a quick reminder — I\'ll show you how quickly the front desk can get started with Podium, no training needed. See you then!', time:'Yesterday 5:00 PM'},
      {dir:'out', text:'📧 Email opened 3 times — most recently this morning at 7:54 AM', time:'Today 7:54 AM', system:true},
    ],
    cta:'Send reminder',
  },
  {
    id:12, type:'email', unread:false, name:'Harbor View Dental', initials:'HV', company:'Dr. Susan Lee',
    time:'Yesterday', preview:'AI-drafted post-demo summary — awaiting your review',
    chips:['Post-demo','Follow-up pending','Draft ready'],
    messages:[
      {dir:'out', text:'📞 Demo call — 48 minutes (Yesterday 2:30 PM)', time:'Yesterday 2:30 PM', system:true},
      {dir:'out', text:'[AI DRAFT — not sent yet]\n\nHi Susan, great speaking with you this afternoon. As promised, here\'s a summary of what we covered and some next steps…', time:'Yesterday 4:00 PM', label:'Draft pending review'},
    ],
    cta:'Review & send',
  },
  {
    id:13, type:'email', unread:false, name:'Mark Henley', initials:'MH', company:'Sunrise Auto Group',
    time:'Yesterday', preview:'Let me run it by my GM and I\'ll get back to you',
    chips:['Demo today 3:30 PM','$18,000/yr','Multi-location'],
    messages:[
      {dir:'out', text:'Mark, great connecting last week. Confirming your demo for 3:30 PM today. I\'ll have the multi-location dashboard and DealerSocket integration ready to show.', time:'Yesterday 4:30 PM'},
      {dir:'in',  text:'Let me run it by my GM and I\'ll get back to you', time:'Yesterday 5:12 PM'},
      {dir:'out', text:'Of course — I\'ll see you at 3:30.', time:'Yesterday 5:18 PM'},
    ],
    cta:'Send reminder',
  },
  {
    id:14, type:'email', unread:false, name:'Peak Performance Gym', initials:'PP', company:'Jordan Mills',
    time:'2 days ago', preview:'Proposal sent — opened, no reply',
    chips:['Proposal sent','$4,800/yr','No reply'],
    messages:[
      {dir:'out', text:'Hi Jordan, attaching the Podium proposal as discussed. Happy to walk through it live if that\'s easier — just let me know.', time:'2 days ago 3:00 PM'},
      {dir:'out', text:'📧 Proposal email opened — 2 days ago 4:22 PM', time:'2 days ago 4:22 PM', system:true},
    ],
    cta:'Send nudge',
  },
];

let currentRole = 'sdr';
let selectedId = null;
let activeFilter = 'all';

function getThreads(){ return currentRole==='sdr' ? sdrThreads : aeThreads; }

function setFilter(f, el){
  activeFilter = f;
  document.querySelectorAll('.ftab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

function renderList(){
  const threads = getThreads();
  const el = document.getElementById('thread-items');
  el.innerHTML = threads.map(t=>`
    <div class="thread-item${t.unread?' unread':''}${selectedId===t.id?' selected':''}" onclick="selectThread(${t.id})">
      ${t.unread?'<div class="ti-badge"></div>':'<div style="width:7px;flex-shrink:0"></div>'}
      <div class="ti-avatar">${t.initials}</div>
      <div class="ti-body">
        <div class="ti-top">
          <div class="ti-name">${t.name}</div>
          <div class="ti-time">${t.time}</div>
        </div>
        <div class="ti-company">${t.company}</div>
        <div class="ti-preview"><span class="ti-type">${t.type}</span>${t.preview}</div>
      </div>
    </div>
  `).join('');
}

function selectThread(id){
  selectedId = id;
  const threads = getThreads();
  const t = threads.find(x=>x.id===id);
  if(!t) return;
  // mark read
  t.unread = false;
  renderList();
  document.getElementById('td-name').textContent = t.name;
  document.getElementById('td-company').textContent = t.company;
  document.getElementById('td-cta').textContent = t.cta || '→';
  // chips
  document.getElementById('td-chips').innerHTML = (t.chips||[]).map(c=>`<span class="info-chip">${c}</span>`).join('');
  // messages
  document.getElementById('td-messages').innerHTML = t.messages.map(m=>`
    <div class="msg ${m.dir}">
      ${m.dir==='in'?`<div class="msg-avatar">${t.initials}</div>`:'<div class="msg-avatar" style="background:var(--acc-d);color:var(--accent)">JL</div>'}
      <div>
        <div class="msg-bubble${m.system?' '+' style="font-style:italic;color:var(--text3);background:transparent;padding:4px 0"':''}"${m.label?` data-label="${m.label}"`:''}>
          ${m.text.replace(/\n/g,'<br>')}
          ${m.label?`<div style="font-size:9px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--amber);margin-top:5px">${m.label}</div>`:''}
        </div>
        <div class="msg-meta">${m.time}</div>
      </div>
    </div>
  `).join('');
  // ai draft
  const draftBar = document.getElementById('ai-draft-bar');
  if(t.aiDraft && currentRole==='sdr'){
    draftBar.style.display='block';
    document.getElementById('ai-draft-text').value = t.aiDraft;
  } else {
    draftBar.style.display='none';
  }
}

// ─── ROLE MANAGEMENT ─────────────────────────────────────────────────────────
const ROLE_KEY = 'gtm_role';
function getRole(){ return localStorage.getItem(ROLE_KEY)||'sdr'; }
function setRole(r){ localStorage.setItem(ROLE_KEY,r); }
function applyRole(r){
  currentRole = r;
  document.body.className = 'role-'+r;
  document.getElementById('role-badge').textContent = r.toUpperCase();
  document.getElementById('toggle-label').textContent = r==='sdr' ? 'Switch to AE View' : 'Switch to SDR View';
  const ql = document.getElementById('queue-link');
  if(ql) ql.textContent = r==='sdr' ? 'Call Queue' : 'Demo Prep';
  selectedId = null;
  renderList();
  // reset detail
  document.getElementById('td-name').textContent = r==='sdr' ? 'Jennifer Walsh' : 'Chris Adams';
  document.getElementById('td-company').textContent = r==='sdr' ? 'Walsh Home Services' : 'Mesa Verde Plumbing';
  // Auto-select first
  const threads = getThreads();
  if(threads.length) selectThread(threads[0].id);
}
function toggleRole(){
  const next = getRole()==='sdr' ? 'ae' : 'sdr';
  setRole(next); applyRole(next);
}

applyRole(getRole());
</script>
</body>
</html>
